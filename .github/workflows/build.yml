name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --console=plain

      # A tag like v0.1.0-alpha.1 builds the optimised APK and publishes it as a pre-release.
      # Signing key: repository secrets KEYSTORE (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the APK is signed with a throw-away debug key (installs, but cannot update an install signed otherwise).
      - name: Build (release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KUKATKO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KUKATKO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KUKATKO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export KUKATKO_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "kukatko-${GITHUB_REF_NAME}.apk"

      - name: Publish pre-release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "kukatko-${GITHUB_REF_NAME}.apk" \
            --prerelease --title "Kukátko ${GITHUB_REF_NAME}" --generate-notes
permissions:
  contents: write
